<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>STOCAAAAZZOOOOOO</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    display: flex; align-items: center; justify-content: center;
    animation: sfondo 1s steps(1) infinite;
  }
  #t {
    font-family: Impact, "Arial Black", Arial, sans-serif;
    font-weight: 900;
    white-space: nowrap;
    line-height: 1;
    animation: scritta 1s steps(1) infinite;
  }
  @keyframes sfondo {
    0%  { background: #ffffff; }
    50% { background: #0033cc; }
  }
  @keyframes scritta {
    0%  { color: #ff0000; }
    50% { color: #ffffff; }
  }
</style>
</head>
<body>
<div id="t">STOCAAAAZZZZOOOOOOOOO!!!!</div>
<script>
  function fit() {
    var t = document.getElementById('t'), s = 10;
    t.style.fontSize = s + 'px';
    while (t.offsetWidth < innerWidth * 0.96 && t.offsetHeight < innerHeight * 0.9 && s < 2000) {
      s += 2; t.style.fontSize = s + 'px';
    }
    t.style.fontSize = (s - 2) + 'px';
  }
  window.addEventListener('load', fit);
  window.addEventListener('resize', fit);
</script>
</body>
</html>
